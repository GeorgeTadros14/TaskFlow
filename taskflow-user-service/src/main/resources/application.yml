server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_users
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Local-dev-only secret. Never commit real secrets - in later phases this moves to an env var.
  secret: "dev-only-secret-key-please-change-me-32chars-min"
  expiration-ms: 3600000 # 1 hour

logging:
  level:
    com.taskflow: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true