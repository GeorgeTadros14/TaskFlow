server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # This server doesn't need to register with itself or fetch a registry
    register-with-eureka: false
    fetch-registry: false
  server:
    # Self-preservation guards against mass-deregistration during network blips.
    # It's a production safety feature, but on a single local machine it just
    # delays seeing accurate "is this service actually down" info - disable for dev.
    enable-self-preservation: false
